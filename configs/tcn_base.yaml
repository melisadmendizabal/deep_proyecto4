# M5 - TCN causal (convoluciones 1D dilatadas). Misma receta que la GRU (guía, sección 2).
# layers = bloques residuales con dilatación 1, 2, 4, 8...; con kernel 3:
#   layers 3 -> campo receptivo 29 min; layers 4 -> 61 min (toda la partida).
name: tcn_base
data:
  path: features/sequences.npz
  exclude_afk_train: true
  drop_groups: [tendencia]   # igual que la GRU: ya ve la historia
model:
  type: tcn
  hidden: 64
  layers: 4
  dropout: 0.1
  kernel_size: 3
train:
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 128
  max_epochs: 50
  patience: 5
  grad_clip: 1.0
  smooth_lambda: 0.0
  seed: 42
