# M3 - MLP por minuto (DL sin secuencia). Usa las mismas features que M2 (LightGBM),
# incluidas las de tendencia, para que M3 vs M4 aísle el efecto de ver la historia.
name: mlp_base
data:
  path: features/sequences.npz
  exclude_afk_train: true
  drop_groups: []
model:
  type: mlp
  hidden: 128
  layers: 2
  dropout: 0.1
train:
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 128
  max_epochs: 50
  patience: 5
  grad_clip: 1.0
  seed: 42
